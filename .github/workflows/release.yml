name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: win32-x64, os: windows-latest, triple: x86_64-pc-windows-msvc}
          - {target: win32-arm64, os: windows-11-arm, triple: aarch64-pc-windows-msvc}
          - {target: darwin-x64, os: macos-15-intel, triple: x86_64-apple-darwin}
          - {target: darwin-arm64, os: macos-15, triple: aarch64-apple-darwin}
          - {target: linux-x64, os: ubuntu-22.04, triple: x86_64-unknown-linux-gnu}
          - {target: linux-arm64, os: ubuntu-22.04-arm, triple: aarch64-unknown-linux-gnu}
          - {target: alpine-x64, os: ubuntu-22.04, triple: x86_64-unknown-linux-musl}
          - {target: alpine-arm64, os: ubuntu-22.04-arm, triple: aarch64-unknown-linux-musl}
    env:
      VSCE_TARGET: ${{ matrix.target }}
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-docs, rustfmt
          targets: ${{ matrix.triple }}
      - name: Install musl linker
        if: startsWith(matrix.target, 'alpine-')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: npm ci
      - run: npm run check
      - run: npm run check:catalog
      - run: cargo fmt --check --manifest-path proxy/Cargo.toml
      - run: cargo test --locked --manifest-path proxy/Cargo.toml --target ${{ matrix.triple }}
      - run: npm test
      - name: Build, package and inspect platform VSIX
        run: npm run package
      - name: Test the packaged release binary
        shell: bash
        run: |
          if [[ "$VSCE_TARGET" == win32-* ]]; then suffix=.exe; else suffix=; fi
          LINGO_TEST_PROXY="$PWD/out/bin/rust-analyzer-lingo-proxy$suffix" node --test test/proxy.test.cjs
      - name: Smoke test current official rust-analyzer
        if: matrix.target == 'win32-x64'
        shell: pwsh
        env:
          LINGO_TEST_MISSING_BODY: "1"
          GH_TOKEN: ${{ github.token }}
        run: |
          $testDir = Join-Path $env:RUNNER_TEMP 'lingo-ra'
          New-Item -ItemType Directory -Force -Path $testDir | Out-Null
          gh release download 2026-09-07 --repo rust-lang/rust-analyzer --pattern rust-analyzer-x86_64-pc-windows-msvc.zip --dir $testDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive -LiteralPath (Join-Path $testDir 'rust-analyzer-x86_64-pc-windows-msvc.zip') -DestinationPath $testDir
          node scripts/smoke-lsp.cjs (Join-Path $testDir 'rust-analyzer.exe') (Join-Path $PWD 'out/bin/rust-analyzer-lingo-proxy.exe')
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: out/packages/*.vsix
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          path: out/packages
          merge-multiple: true
      - name: Validate the complete release and generate checksums
        run: node scripts/release-assets.cjs
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: gh release create "$REF_NAME" out/packages/*.vsix out/packages/SHA256SUMS --verify-tag --title "rust-analyzer-lingo $REF_NAME" --notes-file docs/release-notes.md
